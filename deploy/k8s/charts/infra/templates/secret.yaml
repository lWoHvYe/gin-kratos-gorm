{{- if eq .Values.mysql.mode "standalone" }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  root-password: {{ .Values.mysql.rootPassword | quote }}
{{- end }}
{{- if eq .Values.redis.mode "sentinel" }}
---
# Single source of truth for Redis AUTH: the sentinel topology and the mall
# chart both read this Secret. Keep redis.password empty only for throwaway
# environments; set it from a private values file for anything shared.
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  password: {{ .Values.redis.password | quote }}
{{- end }}
