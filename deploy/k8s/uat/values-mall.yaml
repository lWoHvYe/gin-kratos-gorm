# UAT application plane. The shared mall-gateway is reused; UAT gets its own
# HTTPRoute host and its own mall-uat-data namespace.
namespace: mall-uat
dataNamespace: mall-uat-data
appEnv: dev
logLevel: info

ingress:
  host: uat.mall.local
  gatewayName: mall-gateway
  gatewayNamespace: istio-system
  createGateway: false

mysql:
  host: mysql.mall-uat-data.svc.cluster.local
  port: 3306
  user: root
  password: root
redis:
  addr: redis.mall-uat-data.svc.cluster.local:6379
nats:
  url: nats://nats.mall-uat-data.svc.cluster.local:4222

ai:
  enabled: false
  ragEnabled: false
  ragBuild:
    enabled: false

warehouseMode: split

payment:
  mockEnabled: "true"
