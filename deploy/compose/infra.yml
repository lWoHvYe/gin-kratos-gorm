# Core infrastructure for the mall stack.
#
#   docker compose -f deploy/compose/infra.yml up -d
#   docker compose -f deploy/compose/infra.yml --profile observability up -d
#   docker compose -f deploy/compose/infra.yml --profile tracing up -d
#
# Application containers live in services.yml. Always pass both files to keep
# the shared `mall` network and cross-file depends_on references resolvable:
#
#   docker compose -f deploy/compose/infra.yml -f deploy/compose/services.yml up -d
#
# MySQL init scripts are only executed on an empty data volume. `make db-reset`
# drops the volumes and re-runs them.
name: mall

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  mall:
    name: mall

volumes:
  mysql-data:
  redis-data:
  nats-data:
  etcd-data:
  prometheus-data:
  grafana-data:
  tempo-data:

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
      - ../../migrations:/migrations:ro
    healthcheck:
      # The init phase runs a socket-only server, so TCP becomes available only
      # after 00-databases.sql, 01-schemas.sh and 02-dtm.sql have finished.
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [mall]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mall]
    logging: *default-logging

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # -js enables JetStream, -sd keeps the MALL stream on a named volume.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mall]
    logging: *default-logging

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/etcd"]
    command:
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    environment:
      ETCDCTL_API: "3"
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mall]
    logging: *default-logging

  # DTM coordinates order/payment sagas. Its own transaction state lives in the
  # `dtm` database; branch barriers live in `dtm_barrier`.
  dtm:
    image: yedf/dtm:latest
    restart: unless-stopped
    # The image entrypoint is already /app/dtm/dtm; only pass the config flag.
    command: ["-c", "/app/dtm/conf.yml"]
    volumes:
      - ./dtm/config.yml:/app/dtm/conf.yml:ro
    ports:
      - "36789:36789"
      - "36790:36790"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:36789/api/dtmsvr/version"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [mall]
    logging: *default-logging

  # Optional observability stack: `make run-observability`.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [mall]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [mall]
    logging: *default-logging

  # Optional tracing backend: `docker compose ... --profile tracing up -d tempo`.
  # The Go services do not export spans yet; the OTLP endpoints are ready for it.
  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["tracing"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks: [mall]
    logging: *default-logging
