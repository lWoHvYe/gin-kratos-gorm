# Optional DTM mode for the split order service.
# Only use this when DTM is reachable from this machine; otherwise keep
# configs/order.yaml (local compensation, no DTM).
server:
  http:
    addr: 0.0.0.0:8001
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9001
    timeout: 10s

data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/gin_kratos_order?parseTime=True&loc=Local&charset=utf8mb4
    max_open_conns: 50
    max_idle_conns: 10
    conn_max_lifetime: 3600s
    auto_migrate: false
    seed: false
  transaction:
    mode: dtm
    # If DTM is down at startup, fall back to the local compensation saga.
    fallback_to_local: true
  dtm:
    address: discovery:///dtmservice
    timeout: 5s
    enabled: true

auth:
  jwt_secret: change-me-in-production-32-characters
  jwt_issuer: gin-kratos-gorm
  access_token_ttl: 86400s
  casbin_enabled: false

app:
  env: prod
  metrics_enabled: true
  log_level: info

services:
  product_endpoint: discovery:///product

registry:
  etcd:
    endpoints:
      - 127.0.0.1:2379
