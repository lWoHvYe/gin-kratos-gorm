{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.ingress.gatewayName }}
  namespace: {{ .Values.ingress.gatewayNamespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mall-routes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayName }}
      namespace: {{ .Values.ingress.gatewayNamespace }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/admin/v1
      backendRefs:
        - name: admin
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: gateway
          port: 8080
{{- end }}
