{{- if .Values.jwt.devSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jwt.secretKey }}: {{ .Values.jwt.devSecret | quote }}
{{- end }}
