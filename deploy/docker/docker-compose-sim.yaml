# Local simulation: etcd + DTM in Docker, business services on the host.
#
# The host services must register an endpoint that DTM can reach from inside
# this container, for example:
#
#   ETCD_ENDPOINTS=127.0.0.1:2379
#   DTM_ADDRESS=127.0.0.1:36790
#   GRPC_ENDPOINT=grpc://host.docker.internal:9003
#
# Do this for every service that participates in a DTM branch (inventory,
# order, pricing, payment). Without it, etcd contains `inventory:9003`, which
# DTM cannot resolve from its container.
#
# DTM needs a MySQL store. It is not included here because the host may already
# run MySQL. Set MYSQL_* in deploy/docker/.env, or start a MySQL container and
# point MYSQL_HOST at it. The dtm/dt_barrier schemas must already exist:
#
#   mysql -h127.0.0.1 -uroot -proot < deploy/compose/init/mysql/00-databases.sql
#   mysql -h127.0.0.1 -uroot -proot < deploy/compose/init/mysql/02-dtm.sql
#
# On Linux, MySQL must listen on an address reachable through the Docker host
# gateway, not only 127.0.0.1. On Docker Desktop, host.docker.internal works.
#
# Start:
#   cp deploy/docker/.env.example deploy/docker/.env
#   docker compose -f deploy/docker/docker-compose-sim.yaml up -d etcd dtm
#
# DTM exposes HTTP :36789 and gRPC :36790. Host services use
# DTM_ADDRESS=127.0.0.1:36790; DTM resolves branch services through etcd.

name: mall-sim

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: mall-sim-etcd
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/etcd"]
    command:
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=${ETCD_ADVERTISE_URL:-http://etcd:2379}
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    environment:
      ETCDCTL_API: "3"
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mall-sim]

  dtm:
    image: yedf/dtm:latest
    container_name: mall-sim-dtm
    restart: unless-stopped
    environment:
      STORE_DRIVER: mysql
      STORE_HOST: ${MYSQL_HOST:-host.docker.internal}
      STORE_PORT: ${MYSQL_PORT:-3306}
      STORE_USER: ${MYSQL_USER:-root}
      STORE_PASSWORD: ${MYSQL_PASSWORD:-root}
      STORE_DB: ${MYSQL_DATABASE:-dtm}
      MICRO_SERVICE_DRIVER: dtm-driver-kratos
      MICRO_SERVICE_TARGET: ${DTM_ETCD_TARGET:-etcd://etcd:2379/dtmservice}
      # Endpoint DTM registers in etcd. Host clients use DTM_ADDRESS directly;
      # set this to a host-reachable name if other containers discover DTM.
      MICRO_SERVICE_END_POINT: ${DTM_ENDPOINT:-grpc://host.docker.internal:36790}
      HTTP_PORT: "36789"
      GRPC_PORT: "36790"
    ports:
      - "36789:36789"
      - "36790:36790"
    extra_hosts:
      # Makes host.docker.internal available on Linux; Docker Desktop already
      # provides it on macOS/Windows.
      - "host.docker.internal:host-gateway"
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:36789/api/dtmsvr/version"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [mall-sim]

networks:
  mall-sim:
    name: mall-sim

volumes:
  etcd-data:
    name: mall-sim-etcd-data
