syntax = "proto3";

package mall.v1;

option go_package = "gin-kratos-gorm/api/gen/mall/v1;mallv1";

message Empty {}

// ---------------------------------------------------------------- identity
service IdentityService {
  rpc Register (RegisterRequest) returns (LoginReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc Refresh (RefreshRequest) returns (LoginReply);
  rpc Logout (LogoutRequest) returns (Empty);
  rpc GetUser (GetUserRequest) returns (User);
  rpc CreateAddress (CreateAddressRequest) returns (Address);
  rpc UpdateAddress (UpdateAddressRequest) returns (Address);
  rpc DeleteAddress (DeleteAddressRequest) returns (Empty);
  rpc SetDefaultAddress (SetDefaultAddressRequest) returns (Empty);
  rpc ListAddresses (GetUserRequest) returns (AddressList);
}

message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string phone = 4;
  repeated string roles = 5;
}
message RegisterRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
}
message LoginRequest {
  string username = 1;
  string password = 2;
}
message RefreshRequest { string refresh_token = 1; }
message LogoutRequest { string refresh_token = 1; }
message LoginReply {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}
message GetUserRequest { int64 user_id = 1; }
message Address {
  int64 id = 1;
  int64 user_id = 2;
  string receiver = 3;
  string phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail = 8;
  bool is_default = 9;
}
message CreateAddressRequest { Address address = 1; }
message UpdateAddressRequest { Address address = 1; }
message DeleteAddressRequest { int64 user_id = 1; int64 address_id = 2; }
message SetDefaultAddressRequest { int64 user_id = 1; int64 address_id = 2; }
message AddressList { repeated Address addresses = 1; }

// ---------------------------------------------------------------- catalog
service CatalogService {
  rpc GetProduct (GetProductRequest) returns (Product);
  rpc ListProducts (ListProductsRequest) returns (ProductList);
  rpc GetSku (GetSkuRequest) returns (Sku);
  rpc CreateCategory (CreateCategoryRequest) returns (Category);
  rpc UpdateCategory (UpdateCategoryRequest) returns (Category);
  rpc DeleteCategory (DeleteCategoryRequest) returns (Empty);
  rpc ListCategories (Empty) returns (CategoryList);
  rpc CreateBrand (CreateBrandRequest) returns (Brand);
  rpc UpdateBrand (UpdateBrandRequest) returns (Brand);
  rpc DeleteBrand (DeleteBrandRequest) returns (Empty);
  rpc ListBrands (Empty) returns (BrandList);
  rpc CreateProduct (CreateProductRequest) returns (Product);
  rpc UpdateProduct (UpdateProductRequest) returns (Product);
  rpc DeleteProduct (DeleteProductRequest) returns (Empty);
  rpc SetProductStatus (SetProductStatusRequest) returns (Empty);
  rpc ListAdminProducts (ListAdminProductsRequest) returns (ProductList);
  rpc GetAdminProduct (GetProductRequest) returns (Product);
  rpc CreateSku (CreateSkuRequest) returns (Sku);
  rpc UpdateSku (UpdateSkuRequest) returns (Sku);
  rpc DeleteSku (DeleteSkuRequest) returns (Empty);
  rpc SetSkuStatus (SetSkuStatusRequest) returns (Sku);
}

message Category {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 level = 4;
  int32 sort = 5;
  string status = 6;
}
message CategoryList { repeated Category categories = 1; }
message CreateCategoryRequest { Category category = 1; }
message UpdateCategoryRequest { Category category = 1; }
message DeleteCategoryRequest { int64 id = 1; }

message Brand {
  int64 id = 1;
  string name = 2;
  string logo = 3;
  string status = 4;
}
message BrandList { repeated Brand brands = 1; }
message CreateBrandRequest { Brand brand = 1; }
message UpdateBrandRequest { Brand brand = 1; }
message DeleteBrandRequest { int64 id = 1; }

message ProductImage {
  int64 id = 1;
  string url = 2;
  int32 sort = 3;
}
message ProductAttribute {
  int64 id = 1;
  string name = 2;
  string value = 3;
  int32 sort = 4;
}
message Sku {
  int64 id = 1;
  int64 spu_id = 2;
  string sku_code = 3;
  string specs_json = 4;
  int64 price_cent = 5;
  int64 stock = 6;
  string status = 7;
  string image_url = 8;
  int64 category_id = 9;
  int64 brand_id = 10;
}
message Product {
  int64 id = 1;
  int64 category_id = 2;
  int64 brand_id = 3;
  string name = 4;
  string subtitle = 5;
  string description = 6;
  string main_image = 7;
  string status = 8;
  repeated Sku skus = 9;
  int64 min_price_cent = 10;
  repeated ProductImage images = 11;
  repeated ProductAttribute attributes = 12;
}
message GetProductRequest { int64 id = 1; }
message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int64 category_id = 4;
  int64 brand_id = 5;
  int64 min_price_cent = 6;
  int64 max_price_cent = 7;
  string sort = 8;
}
message ListAdminProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int64 category_id = 4;
  int64 brand_id = 5;
  string status = 6;
}
message ProductList {
  repeated Product products = 1;
  int64 total = 2;
}
message GetSkuRequest { int64 sku_id = 1; }
message SkuInput {
  string sku_code = 1;
  string specs_json = 2;
  int64 price_cent = 3;
  int64 stock = 4;
  string image_url = 5;
}
message CreateProductRequest {
  int64 category_id = 1;
  int64 brand_id = 2;
  string name = 3;
  string subtitle = 4;
  string description = 5;
  string main_image = 6;
  repeated SkuInput skus = 7;
  repeated ProductImage images = 8;
  repeated ProductAttribute attributes = 9;
}
message UpdateProductRequest {
  int64 id = 1;
  int64 category_id = 2;
  int64 brand_id = 3;
  string name = 4;
  string subtitle = 5;
  string description = 6;
  string main_image = 7;
  repeated ProductImage images = 8;
  repeated ProductAttribute attributes = 9;
}
message DeleteProductRequest { int64 id = 1; }
message CreateSkuRequest {
  int64 spu_id = 1;
  SkuInput sku = 2;
}
message UpdateSkuRequest {
  int64 id = 1;
  string sku_code = 2;
  string specs_json = 3;
  int64 price_cent = 4;
  string status = 5;
  string image_url = 6;
}
message DeleteSkuRequest { int64 id = 1; }
message SetSkuStatusRequest { int64 id = 1; string status = 2; }
message SetProductStatusRequest { int64 id = 1; string status = 2; }

// ---------------------------------------------------------------- inventory
service InventoryService {
  rpc GetStock (GetStockRequest) returns (Stock);
  rpc Reserve (ReserveRequest) returns (ReserveReply);
  rpc Confirm (ReserveRequest) returns (Empty);
  rpc Release (ReserveRequest) returns (Empty);
  rpc AdminAdjustStock (AdminAdjustStockRequest) returns (Stock);
  rpc ListStocks (ListStocksRequest) returns (StockList);
  rpc Restock (RestockRequest) returns (Stock);
  rpc TccTryConfirm (TccPaymentRequest) returns (Empty);
  rpc TccConfirm (TccPaymentRequest) returns (Empty);
  rpc TccCancelConfirm (TccPaymentRequest) returns (Empty);
  rpc TccQueryConfirm (TccPaymentRequest) returns (TccQueryReply);
  // Seckill stock is carved out of normal inventory before a sale starts.
  // Allocation/release are idempotent by activity_id.
  rpc AllocateSeckillStock (AllocateSeckillStockRequest) returns (SeckillStock);
  rpc ReleaseSeckillStock (ReleaseSeckillStockRequest) returns (SeckillStock);
  rpc GetSeckillStock (GetSeckillStockRequest) returns (SeckillStock);
  rpc HoldSeckillStock (HoldSeckillStockRequest) returns (SeckillStock);
  rpc ReleaseSeckillHold (ReleaseSeckillHoldRequest) returns (SeckillStock);
  rpc CreateSeckillReservation (CreateSeckillReservationRequest) returns (ReserveReply);
  rpc ReleaseSeckillReservation (ReleaseSeckillReservationRequest) returns (Empty);
}
message Stock {
  int64 sku_id = 1;
  int64 warehouse_id = 2;
  int64 on_hand = 3;
  int64 reserved = 4;
  int64 available = 5;
}
message GetStockRequest { int64 sku_id = 1; int64 warehouse_id = 2; }
message ReserveRequest {
  string order_no = 1;
  int64 sku_id = 2;
  int64 warehouse_id = 3;
  int32 quantity = 4;
  int64 ttl_seconds = 5;
}
message ReserveReply { string reservation_no = 1; int64 expires_at_unix = 2; }
message AdminAdjustStockRequest {
  int64 sku_id = 1;
  int64 warehouse_id = 2;
  int64 delta = 3;
  string reason = 4;
}
message ListStocksRequest {
  int64 sku_id = 1;
  int64 warehouse_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message StockList { repeated Stock stocks = 1; int64 total = 2; }
message RestockRequest {
  string order_no = 1;
  int64 sku_id = 2;
  int64 warehouse_id = 3;
  int64 quantity = 4;
  string condition = 5;
  string reason = 6;
  string restock_no = 7;
}


// ---------------------------------------------------------------- cart
service CartService {
  rpc GetCart (GetCartRequest) returns (Cart);
  rpc AddItem (AddItemRequest) returns (Cart);
  rpc UpdateItem (UpdateItemRequest) returns (Cart);
  rpc RemoveItem (RemoveItemRequest) returns (Cart);
  rpc ClearSelected (ClearCartRequest) returns (Empty);
}
message CartItem {
  int64 sku_id = 1;
  string name = 2;
  int64 price_cent = 3;
  int32 quantity = 4;
  bool selected = 5;
}
message Cart { int64 user_id = 1; repeated CartItem items = 2; int64 total_cent = 3; }
message GetCartRequest { int64 user_id = 1; }
message AddItemRequest { int64 user_id = 1; int64 sku_id = 2; int32 quantity = 3; }
message UpdateItemRequest { int64 user_id = 1; int64 sku_id = 2; int32 quantity = 3; bool selected = 4; }
message RemoveItemRequest { int64 user_id = 1; int64 sku_id = 2; }
message ClearCartRequest { int64 user_id = 1; }

// ---------------------------------------------------------------- pricing
service PricingService {
  rpc CreateQuote (QuoteRequest) returns (Quote);
  rpc GetQuote (GetQuoteRequest) returns (Quote);
  rpc LockCoupon (LockCouponRequest) returns (Empty);
  rpc UnlockCoupon (LockCouponRequest) returns (Empty);
  rpc ConsumeCoupon (LockCouponRequest) returns (Empty);
  rpc TccTryConsume (TccPaymentRequest) returns (Empty);
  rpc TccConfirmConsume (TccPaymentRequest) returns (Empty);
  rpc TccCancelConsume (TccPaymentRequest) returns (Empty);
  rpc TccQueryConsume (TccPaymentRequest) returns (TccQueryReply);
}
message QuoteItem { int64 sku_id = 1; int32 quantity = 2; }
message QuoteRequest {
  int64 user_id = 1;
  repeated QuoteItem items = 2;
  int64 address_id = 3;
  string coupon_id = 4;
}
message QuoteLine {
  int64 sku_id = 1;
  string name = 2;
  int64 price_cent = 3;
  int32 quantity = 4;
  int64 discount_cent = 5;
}
message Quote {
  string quote_id = 1;
  int64 total_cent = 2;
  int64 discount_cent = 3;
  int64 freight_cent = 4;
  int64 pay_cent = 5;
  string coupon_id = 6;
  int64 expires_at_unix = 7;
  repeated QuoteLine lines = 8;
  int64 promotion_discount_cent = 9;
  string applied_promotions_json = 10;
  int64 promotion_version = 11;
  int64 coupon_discount_cent = 12;
}
message GetQuoteRequest { string quote_id = 1; }
message LockCouponRequest { string quote_id = 1; string coupon_id = 2; int64 user_id = 3; }

// ---------------------------------------------------------------- order
service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (Order);
  rpc CreateSeckillOrder (CreateSeckillOrderRequest) returns (Order);
  rpc CreateOrderInner (CreateOrderInnerRequest) returns (Order);
  rpc CancelOrder (CancelOrderRequest) returns (Order);
  rpc CancelOrderInner (CancelOrderInnerRequest) returns (Empty);
  rpc MarkPaid (MarkPaidRequest) returns (Order);
  rpc GetOrder (GetOrderRequest) returns (Order);
  rpc ListOrders (ListOrdersRequest) returns (OrderList);
  rpc TccTryMarkPaid (TccPaymentRequest) returns (Empty);
  rpc TccConfirmMarkPaid (TccPaymentRequest) returns (Empty);
  rpc TccCancelMarkPaid (TccPaymentRequest) returns (Empty);
  rpc TccQueryMarkPaid (TccPaymentRequest) returns (TccQueryReply);
}
message TccPaymentRequest {
  string order_no = 1;
  string payment_no = 2;
  int64 user_id = 3;
  int64 paid_cent = 4;
  string quote_id = 5;
  repeated OrderItem items = 6;
}
message TccQueryReply { bool prepared = 1; }

message OrderItem {
  int64 sku_id = 1;
  string name = 2;
  int64 price_cent = 3;
  int32 quantity = 4;
  int64 discount_cent = 5;
}
message Order {
  string order_no = 1;
  int64 user_id = 2;
  string status = 3;
  int64 total_cent = 4;
  int64 discount_cent = 5;
  int64 freight_cent = 6;
  int64 pay_cent = 7;
  int64 paid_cent = 8;
  string receiver_name = 9;
  string receiver_phone = 10;
  string receiver_address = 11;
  repeated OrderItem items = 12;
  int64 created_at_unix = 13;
  int64 expire_at_unix = 14;
  string quote_id = 15;
  int64 refunded_cent = 16;
  string refund_status = 17;
  int64 promotion_discount_cent = 18;
  string applied_promotions_json = 19;
}
message CreateOrderRequest {
  int64 user_id = 1;
  string quote_id = 2;
  int64 address_id = 3;
  string client_request_id = 4;
  string receiver_name = 5;
  string receiver_phone = 6;
  string receiver_address = 7;
}
message CreateOrderInnerRequest {
  int64 user_id = 1;
  string order_no = 2;
  string quote_id = 3;
  int64 address_id = 4;
  int64 total_cent = 5;
  int64 discount_cent = 6;
  int64 freight_cent = 7;
  int64 pay_cent = 8;
  string receiver_name = 9;
  string receiver_phone = 10;
  string receiver_address = 11;
  repeated OrderItem items = 12;
  int64 expire_at_unix = 13;
  int64 promotion_discount_cent = 14;
  string applied_promotions_json = 15;
}
message CancelOrderRequest { string order_no = 1; int64 user_id = 2; string reason = 3; bool admin = 4; }
message CancelOrderInnerRequest { string order_no = 1; string reason = 2; }
message MarkPaidRequest { string order_no = 1; string payment_no = 2; int64 paid_cent = 3; }
message GetOrderRequest { string order_no = 1; int64 user_id = 2; bool admin = 3; }
message ListOrdersRequest {
  int64 user_id = 1;
  bool admin = 2;
  int32 page = 3;
  int32 page_size = 4;
  string status = 5;
}
message OrderList { repeated Order orders = 1; int64 total = 2; }

// ---------------------------------------------------------------- payment
service PaymentService {
  rpc CreateIntent (CreateIntentRequest) returns (Intent);
  rpc GetIntent (GetIntentRequest) returns (Intent);
  rpc Callback (CallbackRequest) returns (CallbackReply);
  rpc Refund (RefundRequest) returns (Empty);
  rpc RefundOrder (RefundOrderRequest) returns (RefundOrderReply);
  rpc VerifyPayment (VerifyPaymentRequest) returns (VerifyPaymentReply);
  rpc ListRefunds (ListRefundsRequest) returns (RefundList);
}
message Intent {
  string payment_no = 1;
  string order_no = 2;
  int64 amount_cent = 3;
  string status = 4;
  string channel = 5;
  string pay_url = 6;
  int64 expires_at_unix = 7;
  int64 captured_cent = 8;
  int64 refunded_cent = 9;
  string payment_method = 10;
}
message CreateIntentRequest {
  string order_no = 1;
  int64 user_id = 2;
  int64 amount_cent = 3;
  string channel = 4;
}
message GetIntentRequest { string payment_no = 1; }
message CallbackRequest {
  string payment_no = 1;
  string channel = 2;
  string event_id = 3;
  int64 amount_cent = 4;
  string status = 5;
  string signature = 6;
}
message CallbackReply { bool ok = 1; }
message RefundOrderRequest { string order_no = 1; int64 amount_cent = 2; string reason = 3; string idempotency_key = 4; }
message RefundOrderReply { string refund_no = 1; string payment_no = 2; int64 refunded_cent = 3; string status = 4; }
message VerifyPaymentRequest { string payment_no = 1; }
message VerifyPaymentReply {
  bool order_prepared = 1;
  bool inventory_prepared = 2;
  bool pricing_prepared = 3;
  string intent_status = 4;
}
message RefundRequest { string payment_no = 1; int64 amount_cent = 2; string reason = 3; string idempotency_key = 4; }
message Refund {
  string refund_no = 1;
  string payment_no = 2;
  string order_no = 3;
  int64 amount_cent = 4;
  string reason = 5;
  string status = 6;
  int64 created_at_unix = 7;
}
message ListRefundsRequest { string payment_no = 1; string order_no = 2; int32 page = 3; int32 page_size = 4; }
message RefundList { repeated Refund refunds = 1; int64 total = 2; }

// ---------------------------------------------------------------- promotion

service PromotionService {
  rpc EvaluatePromotions (PromotionEvaluateRequest) returns (PromotionEvaluation);
  rpc ReservePromotions (PromotionReserveRequest) returns (PromotionReserveReply);
  rpc ConfirmPromotions (PromotionOrderRequest) returns (Empty);
  rpc ReleasePromotions (PromotionOrderRequest) returns (Empty);
  rpc CreateCampaign (Campaign) returns (Campaign);
  rpc UpdateCampaign (Campaign) returns (Campaign);
  rpc SetCampaignStatus (SetPromotionStatusRequest) returns (Empty);
  rpc ListCampaigns (Empty) returns (CampaignList);
  rpc CreatePromotion (PromotionRule) returns (PromotionRule);
  rpc UpdatePromotion (PromotionRule) returns (PromotionRule);
  rpc SetPromotionStatus (SetPromotionStatusRequest) returns (Empty);
  rpc ListPromotions (PromotionListRequest) returns (PromotionRuleList);
  rpc ListPromotionReservations (ListPromotionReservationsRequest) returns (PromotionReservationList);
}

message Campaign {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string type = 4;
  string status = 5;
  int64 start_at_unix = 6;
  int64 end_at_unix = 7;
  int32 priority = 8;
  int64 budget_cent = 9;
  int64 reserved_cent = 10;
  int64 consumed_cent = 11;
  int32 per_user_limit = 12;
  string stack_mode = 13;
  int64 version = 14;
}

message PromotionRule {
  int64 id = 1;
  int64 campaign_id = 2;
  string code = 3;
  string name = 4;
  string type = 5;
  string status = 6;
  int32 priority = 7;
  bool exclusive = 8;
  string stack_group = 9;
  string scope_json = 10;
  string condition_expr = 11;
  string effect_json = 12;
  int64 max_discount_cent = 13;
  int64 budget_cent = 14;
  int64 reserved_cent = 15;
  int64 consumed_cent = 16;
  int32 per_user_limit = 17;
  bool allow_with_coupon = 18;
  int64 start_at_unix = 19;
  int64 end_at_unix = 20;
  int64 version = 21;
}

message CampaignList { repeated Campaign campaigns = 1; }
message PromotionListRequest { int64 campaign_id = 1; string status = 2; int32 page = 3; int32 page_size = 4; }
message PromotionRuleList { repeated PromotionRule promotions = 1; int64 total = 2; }
message SetPromotionStatusRequest { int64 id = 1; string status = 2; }
message PromotionEvaluateItem {
  int64 sku_id = 1;
  int64 spu_id = 2;
  int64 category_id = 3;
  int64 brand_id = 4;
  int64 price_cent = 5;
  int32 quantity = 6;
}
message PromotionEvaluateRequest {
  int64 user_id = 1;
  repeated PromotionEvaluateItem items = 2;
  bool coupon_applied = 3;
  int64 coupon_discount_cent = 4;
}
message PromotionAllocation { int64 sku_id = 1; int64 discount_cent = 2; }
message AppliedPromotion {
  int64 rule_id = 1;
  int64 campaign_id = 2;
  string code = 3;
  string name = 4;
  string type = 5;
  int64 amount_cent = 6;
  int64 shipping_cent = 7;
  repeated PromotionAllocation allocations = 8;
  int64 rule_version = 9;
  string stack_group = 10;
  int32 priority = 11;
}
message RejectedPromotion { int64 rule_id = 1; string code = 2; string reason = 3; }
message PromotionEvaluation {
  repeated AppliedPromotion applied = 1;
  repeated RejectedPromotion rejected = 2;
  int64 discount_cent = 3;
  int64 shipping_discount_cent = 4;
  int64 promotion_version = 5;
  string snapshot_json = 6;
}
message PromotionReserveRequest { string quote_id = 1; string order_no = 2; int64 user_id = 3; }
message PromotionReserveReply { repeated string reservation_nos = 1; int64 reserved_cent = 2; }
message PromotionOrderRequest { string order_no = 1; }
message ListPromotionReservationsRequest { string order_no = 1; int32 page = 2; int32 page_size = 3; }
message PromotionReservation {
  string reservation_no = 1;
  string quote_id = 2;
  string order_no = 3;
  int64 user_id = 4;
  int64 rule_id = 5;
  int64 campaign_id = 6;
  int64 amount_cent = 7;
  string status = 8;
  int64 created_at_unix = 9;
}
message PromotionReservationList { repeated PromotionReservation reservations = 1; int64 total = 2; }

// ---------------------------------------------------------------- fulfillment
service FulfillmentService {
  rpc CreateShipment (CreateShipmentRequest) returns (Shipment);
  rpc Ship (ShipRequest) returns (Shipment);
  rpc Receive (ReceiveRequest) returns (Shipment);
  rpc GetShipment (GetShipmentRequest) returns (Shipment);
  rpc GetShipmentByOrder (GetShipmentByOrderRequest) returns (Shipment);
  rpc ListShipments (ListShipmentsRequest) returns (ShipmentList);
}
message ShipmentItem { int64 sku_id = 1; int32 quantity = 2; }
message Shipment {
  string shipment_no = 1;
  string order_no = 2;
  string status = 3;
  string carrier = 4;
  string tracking_no = 5;
  repeated ShipmentItem items = 6;
  int64 created_at_unix = 7;
}
message CreateShipmentRequest {
  string order_no = 1;
  int64 warehouse_id = 2;
  string carrier = 3;
  string tracking_no = 4;
  repeated ShipmentItem items = 5;
}
message ShipRequest { string shipment_no = 1; }
message ReceiveRequest { string shipment_no = 1; }
message GetShipmentRequest { string shipment_no = 1; }
message GetShipmentByOrderRequest { string order_no = 1; }
message ListShipmentsRequest { int32 page = 1; int32 page_size = 2; string status = 3; string order_no = 4; }
message ShipmentList { repeated Shipment shipments = 1; int64 total = 2; }

// ---------------------------------------------------------------- aftersales
service AfterSalesService {
  rpc CreateAfterSale (CreateAfterSaleRequest) returns (AfterSale);
  rpc GetAfterSale (GetAfterSaleRequest) returns (AfterSale);
  rpc Approve (ApproveRequest) returns (AfterSale);
  rpc SubmitReturnTracking (SubmitReturnTrackingRequest) returns (AfterSale);
  rpc ReceiveReturn (ReceiveReturnRequest) returns (AfterSale);
  rpc Refund (RefundAfterSaleRequest) returns (AfterSale);
  rpc ListAfterSales (ListAfterSalesRequest) returns (AfterSaleList);
}
message AfterSaleItem { int64 sku_id = 1; int32 quantity = 2; }
message AfterSale {
  string after_sale_no = 1;
  string order_no = 2;
  int64 user_id = 3;
  string type = 4;
  string status = 5;
  int64 amount_cent = 6;
  string reason = 7;
  int64 created_at_unix = 8;
  string return_carrier = 9;
  string return_tracking_no = 10;
  string refund_no = 11;
  int64 refunded_cent = 12;
  repeated AfterSaleItem items = 13;
}
message AfterSaleList { repeated AfterSale after_sales = 1; int64 total = 2; }
message CreateAfterSaleRequest {
  string order_no = 1;
  int64 user_id = 2;
  string type = 3;
  string reason = 4;
  int64 amount_cent = 5;
  repeated AfterSaleItem items = 6;
}
message GetAfterSaleRequest { string after_sale_no = 1; }
message SubmitReturnTrackingRequest { string after_sale_no = 1; string carrier = 2; string tracking_no = 3; }
message ReceiveReturnRequest { string after_sale_no = 1; string condition = 2; }
message ListAfterSalesRequest { int64 user_id = 1; bool admin = 2; int32 page = 3; int32 page_size = 4; string status = 5; }
message ApproveRequest { string after_sale_no = 1; bool approved = 2; int64 amount_cent = 3; string reason = 4; }
message RefundAfterSaleRequest { string after_sale_no = 1; }


// ---------------------------------------------------------------- seckill
service SeckillService {
  rpc CreateActivity (CreateSeckillActivityRequest) returns (SeckillActivity);
  rpc UpdateActivity (UpdateSeckillActivityRequest) returns (SeckillActivity);
  rpc GetActivity (GetSeckillActivityRequest) returns (SeckillActivity);
  rpc ListActivities (ListSeckillActivitiesRequest) returns (SeckillActivityList);
  rpc PublishActivity (SeckillActivityCommand) returns (SeckillActivity);
  rpc PauseActivity (SeckillActivityCommand) returns (SeckillActivity);
  rpc WarmupActivity (SeckillActivityCommand) returns (SeckillActivity);
  rpc GetActivityStock (SeckillActivityCommand) returns (SeckillStock);
  rpc Reserve (ReserveSeckillRequest) returns (SeckillQualification);
  rpc GetQualification (GetSeckillQualificationRequest) returns (SeckillQualification);
  rpc GetPublicActivity (GetSeckillActivityRequest) returns (SeckillActivity);
  rpc ListPublicActivities (ListSeckillActivitiesRequest) returns (SeckillActivityList);
}
message SeckillActivity {
  int64 id = 1;
  int64 campaign_id = 2;
