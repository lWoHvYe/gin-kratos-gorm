server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 302 /admin/;
  }

  location / {
    return 302 /admin/;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
