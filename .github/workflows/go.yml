name: Go

on:
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "api/**"
      - "migrations/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "api/**"
      - "migrations/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/go.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      # Committed api/gen must match api/proto; the plugins are pinned to the
      # versions in the generated file headers.
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: |
          unformatted="$(gofmt -l cmd internal api/gen 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./internal/...

      - name: Build
        run: go build ./cmd/...

      - name: Wire graph is current
        run: |
          make wire
          git diff --exit-code -- cmd

      - name: Architecture guard
        run: ./scripts/check-architecture.sh

      - name: DTM contract guard
        run: ./scripts/check-dtm-contract.sh

      - name: Generated protobuf is current
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          make proto
          git diff --exit-code -- api/gen

      - name: Integration dependencies (NATS JetStream, Redis)
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
          docker run -d --name redis -p 6379:6379 redis:8.10.3-alpine
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 4222 && nc -z 127.0.0.1 6379; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 4222
          nc -z 127.0.0.1 6379

      - name: Integration tests (MySQL, NATS, Redis)
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mall_outbox_test?parseTime=true
          TEST_NATS_URL: nats://127.0.0.1:4222
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test ./internal/platform/outbox -run 'TestClaim|TestMark|TestPrune|TestAppend|TestRelay' -count=1
          go test ./internal/services/seckill -run TestReserveScript -count=1

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
