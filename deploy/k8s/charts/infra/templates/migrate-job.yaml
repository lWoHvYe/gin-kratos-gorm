apiVersion: batch/v1
kind: Job
metadata:
  name: mall-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mall
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mall-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          imagePullPolicy: {{ .Values.migrate.imagePullPolicy }}
          env:
            - name: MYSQL_HOST
              value: mysql.{{ .Values.namespace }}.svc.cluster.local
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
