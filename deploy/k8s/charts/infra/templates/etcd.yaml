apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: {{ .Values.namespace }}
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
    spec:
      containers:
        - name: etcd
          image: {{ .Values.etcd.image }}
          command:
            - /usr/local/bin/etcd
            - --name=etcd
            - --data-dir=/etcd-data
            - --advertise-client-urls=http://etcd.{{ .Values.namespace }}.svc.cluster.local:2379
            - --listen-client-urls=http://0.0.0.0:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd.{{ .Values.namespace }}.svc.cluster.local:2380
            - --initial-cluster=etcd=http://etcd.{{ .Values.namespace }}.svc.cluster.local:2380
            - --initial-cluster-state=new
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          readinessProbe:
            exec:
              command: ["etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /etcd-data
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.etcd.storage }}
