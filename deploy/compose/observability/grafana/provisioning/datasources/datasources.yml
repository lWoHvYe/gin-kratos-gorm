# Grafana datasources provisioned on startup.
# Prometheus is always available with the observability profile; the Tempo
# datasource points at the optional tracing profile and fails softly when Tempo
# is not running.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
