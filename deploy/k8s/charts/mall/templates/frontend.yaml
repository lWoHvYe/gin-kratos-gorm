{{- if .Values.frontend.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
    app.kubernetes.io/name: admin-web
spec:
  replicas: {{ .Values.frontend.admin.replicas }}
  selector:
    matchLabels:
      {{- include "mall.selectorLabels" (dict "name" "admin-web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mall.selectorLabels" (dict "name" "admin-web" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: admin-web
          image: {{ .Values.frontend.admin.image }}
          imagePullPolicy: {{ .Values.frontend.admin.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.frontend.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
    istio.io/ingress-use-waypoint: "true"
spec:
  selector:
    {{- include "mall.selectorLabels" (dict "name" "admin-web" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
{{- end }}
{{- if .Values.frontend.storefront.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
    app.kubernetes.io/name: storefront-web
spec:
  replicas: {{ .Values.frontend.storefront.replicas }}
  selector:
    matchLabels:
      {{- include "mall.selectorLabels" (dict "name" "storefront-web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mall.selectorLabels" (dict "name" "storefront-web" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: storefront-web
          image: {{ .Values.frontend.storefront.image }}
          imagePullPolicy: {{ .Values.frontend.storefront.imagePullPolicy }}
          env:
            - name: NUXT_PUBLIC_API_BASE
              value: ""
            - name: NUXT_PUBLIC_SSR_API_BASE
              value: "http://gateway:8080"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.frontend.storefront.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mall.labels" . | nindent 4 }}
    istio.io/ingress-use-waypoint: "true"
spec:
  selector:
    {{- include "mall.selectorLabels" (dict "name" "storefront-web" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      appProtocol: http
{{- end }}
