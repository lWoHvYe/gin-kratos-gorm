syntax = "proto3";
package kratos.api;

option go_package = "gin-kratos-gorm/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
  Auth auth = 4;
  Order order = 5;
  App app = 6;
  Services services = 7;
}

// =========================
// Server
// =========================
message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    string endpoint = 4;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    string endpoint = 4;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

// =========================
// Data
// =========================
message Data {
  message Database {
    // mysql | sqlite
    string driver = 1;
    // MySQL DSN or SQLite file path (":memory:" for tests)
    string source = 2;
    int32 max_open_conns = 3;
    int32 max_idle_conns = 4;
    google.protobuf.Duration conn_max_lifetime = 5;
    bool auto_migrate = 6;
    bool seed = 7;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
    int32 db = 6;
  }
  message DTM {
    string address = 1;
    google.protobuf.Duration timeout = 2;
    bool enabled = 3;
  }
  message Transaction {
    // local | dtm
    // local: in-process transaction with compensation, no external dependency.
    // dtm:   remote DTM saga (only enable when DTM is reachable).
    string mode = 1;
    // If the DTM health check fails at startup, fall back to local mode.
    bool fallback_to_local = 2;
  }
  Database database = 1;
  Redis redis = 2;
  DTM dtm = 3;
  Transaction transaction = 4;
}

// =========================
// Registry
// =========================
message Registry {
  Etcd etcd = 1;
}

message Etcd {
  repeated string endpoints = 1;
}

// =========================
// Auth
// =========================
message Auth {
  string jwt_secret = 1;
  string jwt_issuer = 2;
  google.protobuf.Duration access_token_ttl = 3;
  bool casbin_enabled = 4;
  string casbin_model_path = 5;
}

// =========================
// Order
// =========================
message Order {
  google.protobuf.Duration payment_timeout = 1;
  google.protobuf.Duration auto_cancel_interval = 2;
  double shipping_fee = 3;
  double free_shipping_threshold = 4;
}

// =========================
// App
// =========================
message App {
  // dev | staging | prod
  string env = 1;
  bool metrics_enabled = 2;
  string log_level = 3;
}

// =========================
// Services (used by split deployments)
// =========================
message Services {
  // direct address (127.0.0.1:9002) or discovery:///product
  string product_endpoint = 1;
  string order_endpoint = 2;
  string user_endpoint = 3;
}
