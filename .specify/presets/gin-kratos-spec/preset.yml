schema_version: "1.0"
preset:
  id: gin-kratos-spec
  name: Gin Kratos Spec Standards
  version: "0.2.0"
  description: Append the constitution Appendix A checklist to the Spec template and ADR constraints/traceability to plan/tasks; includes historical status and v3 exception reference.
requires:
  speckit_version: ">=1.4.0"
provides:
  templates:
    - type: template
      name: spec-template
      file: spec-template.append.md
      strategy: append
    - type: template
      name: plan-template
      file: plan-template.append.md
      strategy: append
    - type: template
      name: tasks-template
      file: tasks-template.append.md
      strategy: append
