apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      mall.io/mesh-policy: enabled
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      mall.io/mesh-policy: enabled
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["{{ .Values.ingress.gatewayNamespace }}", "{{ .Values.namespace }}"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            paths: ["/api/v1/*", "/api/admin/v1/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-l4
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      mall.io/mesh-policy: enabled
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.ingress.gatewayNamespace }}/sa/mall-gateway-istio"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mall-waypoint"
      to:
        - operation:
            ports: ["8080", "8081"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint-l4
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      mall.io/mesh-policy: enabled
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mall-waypoint"
      to:
        - operation:
            ports: ["8080", "8081", "9001", "9002", "9003", "9004", "9005", "9006", "9007", "9008", "9009", "36789", "36790"]
{{- range $rule := .Values.authz.rules }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-{{ $rule.name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    matchLabels:
      mall.io/mesh-policy: enabled
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range $source := $rule.sources }}
              - "cluster.local/ns/{{ $.Values.namespace }}/sa/{{ $source }}-sa"
              {{- end }}
      to:
        - operation:
            paths:
              {{- toYaml $rule.paths | nindent 14 }}
{{- end }}
