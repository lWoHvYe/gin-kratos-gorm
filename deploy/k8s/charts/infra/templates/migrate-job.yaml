apiVersion: batch/v1
kind: Job
metadata:
  name: mall-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mall
  annotations:
    # On upgrade run before the new application pods are rolled out, so they
    # never observe an old schema. On a fresh install MySQL is part of this
    # chart, so the job has to run post-install and wait for it.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  # A missing StorageClass/PVC must not block Helm forever.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mall-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          imagePullPolicy: {{ .Values.migrate.imagePullPolicy }}
          env:
            - name: MYSQL_HOST
              {{- if eq .Values.mysql.mode "external" }}
              value: {{ required "mysql.external.host is required when mysql.mode=external" .Values.mysql.external.host | quote }}
              {{- else }}
              value: mysql.{{ .Values.namespace }}.svc.cluster.local
              {{- end }}
            - name: MYSQL_PORT
              {{- if eq .Values.mysql.mode "external" }}
              value: {{ .Values.mysql.external.port | default 3306 | quote }}
              {{- else }}
              value: "3306"
              {{- end }}
            - name: MYSQL_USER
              {{- if eq .Values.mysql.mode "external" }}
              value: {{ .Values.mysql.external.user | quote }}
              {{- else }}
              value: root
              {{- end }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if eq .Values.mysql.mode "external" }}
                  name: {{ required "mysql.external.existingSecret is required when mysql.mode=external" .Values.mysql.external.existingSecret }}
                  key: {{ .Values.mysql.external.existingSecretKey | default "password" }}
                  {{- else }}
                  name: mysql-credentials
                  key: root-password
                  {{- end }}
