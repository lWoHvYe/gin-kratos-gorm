server:
  http:
    addr: 0.0.0.0:8000
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 10s

data:
  database:
    driver: sqlite
    source: ./dev.db
    max_open_conns: 1
    max_idle_conns: 1
    conn_max_lifetime: 3600s
    auto_migrate: true
    seed: true
  transaction:
    # local = in-process transaction + compensation, no DTM required.
    # dtm  = remote saga (requires a reachable DTM server).
    mode: local
    fallback_to_local: true
  dtm:
    address: discovery:///dtmservice
    timeout: 5s
    enabled: false
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

auth:
  # Override in production: export JWT_SECRET=$(openssl rand -hex 32)
  jwt_secret: dev-only-change-me-32-characters
  jwt_issuer: gin-kratos-gorm
  access_token_ttl: 86400s
  casbin_enabled: true
  casbin_model_path: configs/rbac_model

order:
  payment_timeout: 1800s
  auto_cancel_interval: 30s
  shipping_fee: 10
  free_shipping_threshold: 99

app:
  env: dev
  metrics_enabled: true
  log_level: info

registry:
  etcd:
    endpoints: []
