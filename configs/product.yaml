server:
  http:
    addr: 0.0.0.0:8002
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9002
    timeout: 10s

data:
  database:
    driver: sqlite
    source: ./product.db
    max_open_conns: 1
    auto_migrate: true
    seed: true
  transaction:
    mode: local
    fallback_to_local: true
  dtm:
    address: discovery:///dtmservice
    timeout: 5s
    enabled: false

auth:
  jwt_secret: dev-only-change-me-32-characters
  jwt_issuer: gin-kratos-gorm
  access_token_ttl: 86400s
  casbin_enabled: true
  casbin_model_path: configs/rbac_model

app:
  env: dev
  metrics_enabled: true
  log_level: info

registry:
  etcd:
    endpoints: []
