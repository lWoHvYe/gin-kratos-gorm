server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Direct pod/port-forward access still needs the same-origin BFF routes.
  # The ingress routes /api before /admin, so these locations are only used
  # when the Nginx pod itself is the entry point.
  location /api/v1/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/admin/v1/ {
    proxy_pass http://admin:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 302 /admin/;
  }

  location / {
    return 302 /admin/;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
