syntax = "proto3";

package api.product.v1;


option go_package = "gin-kratos-gorm/api/product/v1;v1";

service Product {
  // 获取商品详情（包含 SPU 和 SKU 列表）
  rpc GetProductDetail (GetProductDetailReq) returns (GetProductDetailReply) {}
  // 商品列表（分页/关键词/分类/上架状态）
  rpc ListProducts (ListProductsReq) returns (ListProductsReply) {}
  // 创建商品（管理员）
  rpc CreateProduct (CreateProductReq) returns (GetProductDetailReply) {}
  // 更新商品基础信息（管理员）
  rpc UpdateProduct (UpdateProductReq) returns (GetProductDetailReply) {}
  // 上架/下架（管理员）
  rpc SetOnSale (SetOnSaleReq) returns (SimpleResponse) {}
  // 调整库存（管理员）
  rpc AdjustStock (AdjustStockReq) returns (AdjustStockReply) {}
  // 查询单个 SKU（供订单服务获取权威价格/库存）
  rpc GetSku (GetSkuReq) returns (SkuDetail) {}

  rpc ReduceStock (ReduceStockReq) returns (SimpleResponse) {}     // 正向：扣库存
  rpc CompensateStock (ReduceStockReq) returns (SimpleResponse) {} // 补偿：回滚库存
}

message GetProductDetailReq {
  uint32 id = 1;
}

// SKU 详细信息
message SkuInfo {
  uint32 id = 1;
  string sku_code = 2;
  string attr_value = 3; // 规格组合 JSON，如 {"颜色": "黑色", "内存": "256G"}
  double price = 4;
  int32 stock = 5;
}

// 商品详情完整响应
message GetProductDetailReply {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string main_image = 4;
  uint32 category_id = 5;
  uint32 brand_id = 6;
  repeated SkuInfo skus = 7;
  bool is_on_sale = 8;
}

message ListProductsReq {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  int64 category_id = 4;
  optional bool on_sale = 5;
}

message ProductSummary {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string main_image = 4;
  uint32 category_id = 5;
  uint32 brand_id = 6;
  bool is_on_sale = 7;
  double min_price = 8;
  int64 total_stock = 9;
}

message ListProductsReply {
  repeated ProductSummary products = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SkuInput {
  string sku_code = 1;
  string attr_value = 2;
  double price = 3;
  int64 stock = 4;
}

message CreateProductReq {
  string name = 1;
  string description = 2;
  uint32 category_id = 3;
  uint32 brand_id = 4;
  string main_image = 5;
  repeated SkuInput skus = 6;
}

message UpdateProductReq {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  uint32 category_id = 4;
  uint32 brand_id = 5;
  string main_image = 6;
}

message SetOnSaleReq {
  uint32 id = 1;
  bool on_sale = 2;
}

message AdjustStockReq {
  uint32 sku_id = 1;
  int32 delta = 2;
}

message AdjustStockReply {
  int64 sku_id = 1;
  int64 stock = 2;
}

message GetSkuReq {
  int64 sku_id = 1;
}

message SkuDetail {
  int64 id = 1;
  int64 spu_id = 2;
  string sku_name = 3;
  string sku_pic = 4;
  double price = 5;
  int64 stock = 6;
  bool on_sale = 7;
}

// 库存扣减
message ReduceStockReq {
  string OrderSn = 1;
  int64 SkuId = 2;
  int32 Num = 3;
}

message SimpleResponse {
  string msg = 1;
}
