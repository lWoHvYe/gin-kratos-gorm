apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mall-waypoint
  namespace: {{ .Values.namespace }}
  labels:
    istio.io/waypoint-for: service
    {{- include "mall.labels" . | nindent 4 }}
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
