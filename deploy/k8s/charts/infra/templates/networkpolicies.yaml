apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mall
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mall-and-dns
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mall
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mall
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        {{- if eq .Values.redis.mode "sentinel" }}
        - protocol: TCP
          port: 26379
        {{- end }}
        - protocol: TCP
          port: 4222
        {{- if gt (int .Values.nats.replicas) 1 }}
        - protocol: TCP
          port: 6222
        {{- end }}
        - protocol: TCP
          port: 2379
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.network.nodeCIDR }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-probes
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mall
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.network.nodeCIDR }}
{{- end }}
