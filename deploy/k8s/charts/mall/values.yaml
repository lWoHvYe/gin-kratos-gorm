namespace: mall

image:
  registry: mall
  tag: dev
  pullPolicy: IfNotPresent

appEnv: dev
logLevel: info

mysql:
  host: mysql.mall-data.svc.cluster.local
  port: 3306
  user: root
  password: root
  # Optional Secret holding the MySQL password. When set, the DSN is assembled
  # from $(MYSQL_USER)/$(MYSQL_PASSWORD) so no credential lands in values.
  credentialsSecret: ""
  credentialsSecretKey: password
  # Optional per-pod pool limits; empty keeps the in-code defaults (30/10).
  maxOpenConns: ""
  maxIdleConns: ""

redis:
  addr: redis.mall-data.svc.cluster.local:6379
  password: ""
  # Optional password Secret (key defaults to "password").
  passwordSecret: ""
  passwordSecretKey: password
  # HA endpoint settings. Leave empty for the standalone REDIS_ADDR path.
  # mode: sentinel requires masterName and addrs. mode: cluster requires addrs.
  mode: ""
  addrs: ""
  masterName: ""

nats:
  url: nats://nats.mall-data.svc.cluster.local:4222
  # >1 creates the durable streams with replicated JetStream storage.
  streamReplicas: ""

# Optional etcd configuration center. Leave empty to run without it.
etcd:
  endpoints: ""
  configPath: ""

dtm:
  address: dtm:36790
  image: yedf/dtm:latest
  replicas: 1

jwt:
  issuer: mall
  accessTTL: 15m
  refreshTTL: 720h
  secretName: mall-secrets
  secretKey: jwt-secret
  # Set existingSecret when the Secret is managed out of band. Production
  # overlays must do this; the chart refuses to render devSecret there.
  existingSecret: ""
  # Local-only default; override with an external Secret for anything real.
  devSecret: dev-only-change-me-32-characters

payment:
  secret: ""
  # Secret-managed callback key (key defaults to payment-secret).
  existingSecret: ""
  existingSecretKey: payment-secret
  # The BFF mock-pay route requires this flag; production overlays disable it.
  mockEnabled: "true"
  tccEnabled: "true"

ingress:
  enabled: true
  host: mall.local
  gatewayName: mall-gateway
  gatewayNamespace: istio-system
  serviceAccount: istio-ingressgateway

monitoring:
  namespace: monitoring

network:
  # CIDR allowed to reach health probes when the CNI does not exempt host traffic.
  # Leave empty to rely on the CNI's probe exemption.
  nodeCIDR: ""
  # Egress-only: CIDR of an external MySQL when mysql.mode is not in-cluster.
  # Empty keeps the default-deny egress (in-cluster mall-data only).
  externalMySQLCIDR: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

seckill:
  # Optional Secret holding SECKILL_TOKEN_SECRET (admission HMAC key).
  tokenSecretName: ""
  tokenSecretKey: seckill-token-secret

services:
  gateway:
    protocol: http
    port: 8080
    healthPort: 8080
    mysqlDatabase: mall_admin
  admin:
    protocol: http
    port: 8081
    healthPort: 8081
    mysqlDatabase: mall_admin
  identity:
    protocol: grpc
    port: 9001
    healthPort: 9101
    mysqlDatabase: mall_identity
  catalog:
    protocol: grpc
    port: 9002
    healthPort: 9102
    mysqlDatabase: mall_catalog
  inventory:
    protocol: grpc
    port: 9003
    healthPort: 9103
    mysqlDatabase: mall_inventory
  cart:
    protocol: grpc
    port: 9004
    healthPort: 9104
    mysqlDatabase: mall_cart
  pricing:
    protocol: grpc
    port: 9005
    healthPort: 9105
    mysqlDatabase: mall_pricing
  order:
    protocol: grpc
    port: 9006
    healthPort: 9106
    mysqlDatabase: mall_order
  payment:
    protocol: grpc
    port: 9007
    healthPort: 9107
    mysqlDatabase: mall_payment
  fulfillment:
    protocol: grpc
    port: 9008
    healthPort: 9108
    mysqlDatabase: mall_fulfillment
  aftersales:
    protocol: grpc
    port: 9009
    healthPort: 9109
    mysqlDatabase: mall_aftersales
  seckill:
    protocol: grpc
    port: 9010
    healthPort: 9110
    mysqlDatabase: mall_seckill

# L7 service-to-service matrix. Each rule allows one source ServiceAccount to
# call one service's gRPC methods. Ingress is handled separately.
frontend:
  admin:
    enabled: true
    image: mall/admin-web:dev
    imagePullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
  storefront:
    enabled: true
    image: mall/storefront-web:dev
    imagePullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 384Mi }

# Opt-in production autoscaling. HPA is a safety net; pre-scale before a sale.
autoscaling:
  seckill:
    enabled: false
    minReplicas: 4
    maxReplicas: 40
    targetCPUUtilizationPercentage: 65

podDisruptionBudgets:
  seckill:
    enabled: false
    minAvailable: 1
  admin-web:
    enabled: false
    minAvailable: 1
  storefront-web:
    enabled: false
    minAvailable: 1

authz:
  rules:
    - name: identity
      sources: [gateway]
      paths: ["/mall.v1.IdentityService/*"]
    - name: catalog
      sources: [gateway, admin, cart, pricing]
      paths: ["/mall.v1.CatalogService/*"]
    - name: inventory
      sources: [gateway, admin, order, payment, aftersales, dtm, seckill]
      paths: ["/mall.v1.InventoryService/*"]
    - name: cart
      sources: [gateway]
      paths: ["/mall.v1.CartService/*"]
    - name: pricing
      sources: [gateway, admin, order, payment, dtm]
      paths: ["/mall.v1.PricingService/*", "/mall.v1.PromotionService/*"]
    - name: order
      sources: [gateway, admin, payment, aftersales, dtm, seckill]
      paths: ["/mall.v1.OrderService/*"]
    - name: payment
      sources: [gateway, admin, aftersales, seckill]
      paths: ["/mall.v1.PaymentService/*"]
    - name: fulfillment
      sources: [gateway, admin]
      paths: ["/mall.v1.FulfillmentService/*"]
    - name: aftersales
      sources: [gateway, admin]
      paths: ["/mall.v1.AfterSalesService/*"]
    - name: seckill
      sources: [admin, gateway]
      paths: ["/mall.v1.SeckillService/*"]
    - name: dtm
      sources: [order, payment]
      paths: ["/dtmgimp.Dtm/*"]
