// AIService is the assistant gateway. It owns no business data: tools call the
// domain services. user_id is injected by the BFF from the JWT and must not be
// trusted from the browser.
service AIService {
  rpc Chat (AIChatRequest) returns (stream AIChatEvent);
  rpc SubmitFeedback (AIFeedbackRequest) returns (Empty);
  rpc FeedbackSummary (FeedbackSummaryRequest) returns (FeedbackSummaryReply);
  // Admin-only retrieval inspection for quality evaluation.
  rpc SearchKnowledge (KnowledgeSearchRequest) returns (KnowledgeSearchReply);
  rpc GetCartDraft (GetCartDraftRequest) returns (CartDraftReply);
  rpc CompleteCartDraft (CompleteCartDraftRequest) returns (Empty);
  rpc GetPreferences (GetAIPreferencesRequest) returns (AIPreferences);
  rpc SetPreferences (SetAIPreferencesRequest) returns (AIPreferences);
  rpc ClearPreferences (ClearAIPreferencesRequest) returns (Empty);
  rpc OpsBrief (OpsBriefRequest) returns (OpsBriefReply);
  rpc LatestOpsBrief (Empty) returns (OpsBriefReply);
  rpc OpsFeedback (OpsFeedbackRequest) returns (Empty);
  // Admin-only draft review. Start interrupts; Resume closes the checkpoint
  // after the BFF has saved the draft through the normal apply endpoint.
  rpc StartCampaignDraft (StartCampaignDraftRequest) returns (CampaignDraftReply);
  rpc CheckCampaignDraft (ResumeCampaignDraftRequest) returns (Empty);
  rpc ResumeCampaignDraft (ResumeCampaignDraftRequest) returns (Empty);
  rpc AbortCampaignDraft (AbortCampaignDraftRequest) returns (Empty);
}

message AIChatRequest {
  string session_id = 1;
  string message = 2;
  int64 user_id = 3;
  // admin selects the operations agent. Only the admin BFF sets it.
  bool admin = 4;
}

message FeedbackSummaryRequest { int32 days = 1; }
message KnowledgeSearchRequest { string query = 1; int32 limit = 2; }
message KnowledgeDoc { string id = 1; string title = 2; string content = 3; string kind = 4; double score = 5; }
message KnowledgeSearchReply { repeated KnowledgeDoc docs = 1; }
message GetCartDraftRequest { string draft_id = 1; int64 user_id = 2; }
message CartDraftReply { string draft_json = 1; bool confirmed = 2; }
message CompleteCartDraftRequest { string draft_id = 1; int64 user_id = 2; }
message AIPreferences {
  repeated string preferred_categories = 1;
  repeated string preferred_brands = 2;
  int64 budget_min_cent = 3;
  int64 budget_max_cent = 4;
  repeated string sizes = 5;
  int64 updated_at = 6;
}
message GetAIPreferencesRequest { int64 user_id = 1; }
message SetAIPreferencesRequest { int64 user_id = 1; AIPreferences preferences = 2; }
message ClearAIPreferencesRequest { int64 user_id = 1; }
message OpsBriefRequest { int32 days = 1; }
message OpsFeedbackRequest {
  string day = 1;
  int32 rating = 2;
  string comment = 3;
  int64 admin_user_id = 4;
}
message OpsBriefReply {
  string summary = 1;
  int64 total_orders = 2;
  int64 paid_orders = 3;
  int64 paid_cent = 4;
  int64 after_sales = 5;
  int64 refunded_cent = 6;
  int64 low_stock = 7;
  int64 from_unix = 8;
  int64 to_unix = 9;
  int64 generated_at = 10;
  repeated string exception_links = 11;
}
message StartCampaignDraftRequest {
  int64 user_id = 1;
  string name = 2;
  string type = 3;
  int64 threshold_cent = 4;
  int64 discount_cent = 5;
  int32 percent = 6;
  int32 days = 7;
  int64 budget_cent = 8;
  int32 per_user_limit = 9;
}
message CampaignDraftReply {
  string checkpoint_id = 1;
  string draft_json = 2;
}
message AbortCampaignDraftRequest {
  int64 user_id = 1;
  string checkpoint_id = 2;
  string reason = 3;
}
message ResumeCampaignDraftRequest {
  int64 user_id = 1;
  string checkpoint_id = 2;
  string campaign_code = 3;
  string rule_code = 4;
  Campaign campaign = 5;
  PromotionRule rule = 6;
}
message FeedbackDaySummary {
  string day = 1;
  int64 helpful = 2;
  int64 not_helpful = 3;
}
message FeedbackComment {
  string day = 1;
  string comment = 2;
}
message FeedbackSummaryReply {
  int64 total = 1;
  int64 helpful = 2;
  int64 not_helpful = 3;
  repeated FeedbackDaySummary days = 4;
  repeated FeedbackComment not_helpful_comments = 5;
}

message AIFeedbackRequest {
  string session_id = 1;
  // rating is 1 (helpful) or -1 (not helpful).
  int32 rating = 2;
  string comment = 3;
  // Set by the BFF from the access token; never by the model.
  int64 user_id = 4;
}

message AIChatEvent {
  // type is one of: delta, tool, done, error, attribution.
  string type = 1;
  string delta = 2;
  string tool = 3;
  string error = 4;
  // draft_json is set when type=draft (currently a cart draft).
  string draft_json = 5;
  // attribution_json is set when type=attribution. It lists the explicit,
  // user-scoped preference fields that shaped this answer; it never contains
  // another user's data or raw prompt text.
  string attribution_json = 6;
}
