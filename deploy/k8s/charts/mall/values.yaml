namespace: mall
# Namespace that owns MySQL/Redis/NATS for this release. Kept separate so a
# UAT release can use its own data plane without sharing mall-data.
dataNamespace: mall-data

image:
  registry: mall
  tag: dev
  pullPolicy: IfNotPresent

appEnv: dev
logLevel: info
# Phase 2a: call Inventory AllocateOrder during checkout preview and log
# mismatches without changing the quote. Keep false outside dev until phase 2b.
warehouseAllocationShadow: false
# Phase 3b: allow multi-group quotes/orders. Keep false until split
# shipments/permits (phase 4) are ready.
warehouseSplitEnabled: false
# Single switch preferred over the two booleans: off|shadow|split. When set,
# the chart passes only WAREHOUSE_MODE and config rejects conflicting legacy
# flags. Empty keeps the legacy booleans for older values files.
warehouseMode: ""

# SPEC-0001 / ADR-0005 §13.1 feature switches. All default false: production
# stays on the single-warehouse, single-group, free-text-carrier path until the
# ADR-0003 gates are explicitly run. Each key is injected only into the service
# that consumes it (see templates/deployments.yaml).
# quantitySplitEnabled requires warehouseMode=split; QUANTITY_SPLIT_ENABLED
# fails startup without WAREHOUSE_MODE=split, so the chart injects both into
# inventory and refuses to render the broken combination.
quantitySplitEnabled: false
# fulfillment: controlled carrier registry admission.
carrierRegistryEnabled: false
# fulfillment: T+1/T+7 receipt auto-confirm worker.
deliveryAutoConfirmEnabled: false
# order: post-payment shortage choice flow (48h fail-safe worker).
shortageCaseEnabled: false
# aftersales: freight responsibility determination and refund hold.
freightResponsibilityEnabled: false

# fulfillment: settlement consumer switch (R0.4d1, ADR-0007 Addendum-r0.4).
# The chart only injects the values; the process still fail-closes at startup.
settlement:
  # FULFILLMENT_SETTLE_CONSUMER_MODE. paid is the only production default.
  # shadow is hard-rejected until T4.4 delivers the observe-only consumer;
  # settled requires an APPROVED settlement_switch_approvals row.
  consumerMode: paid
  # SETTLE_RELEASE_APPROVAL_ID: required for settled, must be empty for
  # paid/shadow (N5). Injected only when non-empty.
  approvalID: ""
  # SETTLE_RELEASE_RANGE: required for shadow/settled and must exactly equal
  # the approval row's release_range. Empty is never a wildcard.
  releaseRange: ""

mysql:
  host: mysql.mall-data.svc.cluster.local
  port: 3306
  user: root
  password: root
  # Optional Secret holding the MySQL password. When set, the DSN is assembled
  # from $(MYSQL_USER)/$(MYSQL_PASSWORD) so no credential lands in values.
  credentialsSecret: ""
  credentialsSecretKey: password
  # Optional per-pod pool limits; empty keeps the in-code defaults (30/10).
  maxOpenConns: ""
  maxIdleConns: ""

redis:
  addr: redis.mall-data.svc.cluster.local:6379
  password: ""
  # Optional password Secret (key defaults to "password").
  passwordSecret: ""
  passwordSecretKey: password
  # HA endpoint settings. Leave empty for the standalone REDIS_ADDR path.
  # mode: sentinel requires masterName and addrs. mode: cluster requires addrs.
  mode: ""
  addrs: ""
  masterName: ""

nats:
  url: nats://nats.mall-data.svc.cluster.local:4222
  # >1 creates the durable streams with replicated JetStream storage.
  streamReplicas: ""

# Browser CORS allowlist (comma separated). Empty means no cross-origin access;
# same-origin storefront/admin calls are unaffected.
corsAllowedOrigins: ""

# Optional etcd configuration center. Leave empty to run without it.
etcd:
  endpoints: ""
  configPath: ""

dtm:
  address: dtm:36790
  image: yedf/dtm:latest
  replicas: 1

jwt:
  issuer: mall
  accessTTL: 15m
  refreshTTL: 720h
  secretName: mall-secrets
  secretKey: jwt-secret
  # Set existingSecret when the Secret is managed out of band. Production
  # overlays must do this; the chart refuses to render devSecret there.
  existingSecret: ""
  # Local-only default; override with an external Secret for anything real.
  devSecret: dev-only-change-me-32-characters

payment:
  secret: ""
  # Secret-managed callback key (key defaults to payment-secret).
  existingSecret: ""
  existingSecretKey: payment-secret
  # Secure default: mock pay is off and a real secret is required. The
  # single-node dev overlay explicitly enables mock pay.
  mockEnabled: "false"
  tccEnabled: "true"

ingress:
  enabled: true
  host: mall.local
  gatewayName: mall-gateway
  gatewayNamespace: istio-system
  # A second release can attach to an existing shared Gateway. Set false in
  # UAT when the mall-gateway already exists.
  createGateway: true
  serviceAccount: istio-ingressgateway

monitoring:
  namespace: monitoring

network:
  # CIDR allowed to reach health probes when the CNI does not exempt host traffic.
  # Leave empty to rely on the CNI's probe exemption.
  nodeCIDR: ""
  # Egress-only: CIDR of an external MySQL when mysql.mode is not in-cluster.
  # Empty keeps the default-deny egress (in-cluster mall-data only).
  externalMySQLCIDR: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

tracing:
  # OTLP gRPC endpoint (e.g. an in-cluster collector). Empty disables tracing.
  endpoint: ""
  # When the collector is in a namespace covered by a default-deny egress
  # policy, set this namespace (and optional port) to add an explicit allow.
  namespace: ""
  port: 4317
  samplerArg: "1"

seckill:
  # Optional Secret holding SECKILL_TOKEN_SECRET (admission HMAC key).
  tokenSecretName: ""
  tokenSecretKey: seckill-token-secret

ai:
  # The assistant is optional; disabling it hides the BFF route.
  # 2026-11-23 (H5): production default is off until the Mesh live UAT
  # (scripts/check-ai-mesh.sh) passes on the narrowed authorization matrix.
  # dev/UAT overlays may enable it explicitly.
  enabled: false
  provider: mock
  model: deepseek-chat
  deepseekBaseURL: https://api.deepseek.com
  # Secret holding DEEPSEEK_API_KEY; required when provider=deepseek.
  apiKeySecret: ""
  apiKeySecretKey: deepseek-api-key
  # Redis Search RAG. hash is a deterministic lexical fallback for dev; point
  # provider=openai at a real embedding model (BGE/Qwen/OpenAI-compatible) for
  # semantic retrieval.
  ragEnabled: true
  # The index is built by the dedicated `ai-rag-build` Job (the same image with
  # args ["rag-build"]); AI Pods only load the published alias. The Job is a
  # post-install/post-upgrade hook and also runs as a daily CronJob for drift
  # repair. A fresh current version (age < maxAge) is reused, so hook retries
  # and repeated upgrades are cheap.
  ragBuild:
    enabled: true
    # Blocking post-upgrade hook. Off by default: optional AI must not block
    # the core mall release. Enable only where a fresh index is a hard gate.
    hook: false
    # Rebuild only when the published version is older than this. "0" always
    # rebuilds; an invalid/empty value is rejected by the Job.
    maxAge: 24h
    # Non-blocking CronJob for initial build, retries and drift repair; empty
    # disables it. Manual trigger:
    #   kubectl -n mall create job --from=cronjob/ai-rag-build-scheduled ai-rag-build-manual
    schedule: "0 */6 * * *"
    activeDeadlineSeconds: 1800
    backoffLimit: 6
  # Optional Redis index base; empty means ai_kb. The pointer key is namespaced
  # by this value (the default keeps ai:rag:current).
  ragIndex: ""
  # How often AI Pods re-read the published alias. Builds are picked up within
  # this window; it does not trigger builds.
  aliasRefresh: 1m
  embeddingProvider: hash
  embeddingBaseURL: https://api.openai.com/v1
  embeddingModel: text-embedding-3-small
  embeddingDim: 256
  embeddingAPIKeySecret: ""
  embeddingAPIKeySecretKey: embedding-api-key
  # Per-user and global daily token budgets; 0 disables. Prices are optional
  # cents per 1k tokens for cost metrics (not billing).
  dailyTokenBudget: 200000
  globalDailyTokenBudget: 0
  circuitFailures: 5
  circuitCooldown: 60s
  pricePromptPer1K: 0
  priceCompletionPer1K: 0
  # Optional ops-brief webhook. The secret is mandatory when the URL is set:
  # delivery is refused rather than downgraded to an unsigned POST. Payloads
  # carry X-Mall-Timestamp / X-Mall-Signature (HMAC-SHA256 over
  # "<timestamp>.<body>") and X-Mall-Delivery for idempotency.
  opsBriefWebhookURL: ""
  opsBriefWebhookSecretName: ""
  opsBriefWebhookSecretKey: webhook-secret

services:
  gateway:
    protocol: http
    port: 8080
    healthPort: 8080
    mysqlDatabase: mall_admin
  admin:
    protocol: http
    port: 8081
    healthPort: 8081
    mysqlDatabase: mall_admin
  identity:
    protocol: grpc
    port: 9001
    healthPort: 9101
    mysqlDatabase: mall_identity
  catalog:
    protocol: grpc
    port: 9002
    healthPort: 9102
    mysqlDatabase: mall_catalog
  inventory:
    protocol: grpc
    port: 9003
    healthPort: 9103
    mysqlDatabase: mall_inventory
  cart:
    protocol: grpc
    port: 9004
    healthPort: 9104
    mysqlDatabase: mall_cart
  pricing:
    protocol: grpc
    port: 9005
    healthPort: 9105
    mysqlDatabase: mall_pricing
  order:
    protocol: grpc
    port: 9006
    healthPort: 9106
    mysqlDatabase: mall_order
  payment:
    protocol: grpc
    port: 9007
    healthPort: 9107
    mysqlDatabase: mall_payment
  fulfillment:
    protocol: grpc
    port: 9008
    healthPort: 9108
    mysqlDatabase: mall_fulfillment
  aftersales:
    protocol: grpc
    port: 9009
    healthPort: 9109
    mysqlDatabase: mall_aftersales
  seckill:
    protocol: grpc
    port: 9010
    healthPort: 9110
    mysqlDatabase: mall_seckill
  ai:
    protocol: grpc
    port: 9011
    healthPort: 9111
    mysqlDatabase: mall_admin

# L7 service-to-service matrix. Each rule allows one source ServiceAccount to
# call one service's gRPC methods. Ingress is handled separately.
frontend:
  admin:
    enabled: true
    image: mall/admin-web:dev
    imagePullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
  storefront:
    enabled: true
    image: mall/storefront-web:dev
    imagePullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 384Mi }

# Opt-in production autoscaling. HPA is a safety net; pre-scale before a sale.
autoscaling:
  seckill:
    enabled: false
    minReplicas: 4
    maxReplicas: 40
    targetCPUUtilizationPercentage: 65

podDisruptionBudgets:
  seckill:
    enabled: false
    minAvailable: 1
  admin-web:
    enabled: false
    minAvailable: 1
  storefront-web:
    enabled: false
    minAvailable: 1

authz:
  # The AI service account is read-only. This DENY is the final guard against
  # a future wildcard ALLOW or an L4 waypoint bypass; every current non-read
  # method on a service the AI may reach is listed explicitly.
  aiDenyPaths:
    - "/mall.v1.CatalogService/CreateCategory"
    - "/mall.v1.CatalogService/UpdateCategory"
    - "/mall.v1.CatalogService/DeleteCategory"
    - "/mall.v1.CatalogService/CreateBrand"
    - "/mall.v1.CatalogService/UpdateBrand"
    - "/mall.v1.CatalogService/DeleteBrand"
    - "/mall.v1.CatalogService/CreateProduct"
    - "/mall.v1.CatalogService/UpdateProduct"
    - "/mall.v1.CatalogService/DeleteProduct"
    - "/mall.v1.CatalogService/SetProductStatus"
    - "/mall.v1.CatalogService/ListAdminProducts"
    - "/mall.v1.CatalogService/GetAdminProduct"
    - "/mall.v1.CatalogService/CreateSku"
    - "/mall.v1.CatalogService/UpdateSku"
    - "/mall.v1.CatalogService/DeleteSku"
    - "/mall.v1.CatalogService/SetSkuStatus"
    - "/mall.v1.InventoryService/BatchGetStock"
    - "/mall.v1.InventoryService/Reserve"
    - "/mall.v1.InventoryService/Confirm"
    - "/mall.v1.InventoryService/Release"
    - "/mall.v1.InventoryService/AdminAdjustStock"
    - "/mall.v1.InventoryService/ListStocks"
    - "/mall.v1.InventoryService/ReplayInventoryOperation"
    - "/mall.v1.InventoryService/AllocateOrder"
    - "/mall.v1.InventoryService/Restock"
    - "/mall.v1.InventoryService/TccTryConfirm"
    - "/mall.v1.InventoryService/TccConfirm"
    - "/mall.v1.InventoryService/TccCancelConfirm"
    - "/mall.v1.InventoryService/TccQueryConfirm"
    - "/mall.v1.InventoryService/AllocateSeckillStock"
    - "/mall.v1.InventoryService/ReleaseSeckillStock"
    - "/mall.v1.InventoryService/GetSeckillStock"
    - "/mall.v1.InventoryService/HoldSeckillStock"
    - "/mall.v1.InventoryService/ReleaseSeckillHold"
    - "/mall.v1.InventoryService/CreateSeckillReservation"
    - "/mall.v1.InventoryService/ReleaseSeckillReservation"
    - "/mall.v1.PromotionService/EvaluatePromotions"
    - "/mall.v1.PromotionService/ReservePromotions"
    - "/mall.v1.PromotionService/ConfirmPromotions"
    - "/mall.v1.PromotionService/ReleasePromotions"
    - "/mall.v1.PromotionService/CreateCampaign"
    - "/mall.v1.PromotionService/CreateCampaignWithRule"
    - "/mall.v1.PromotionService/GetCampaignWithRuleByCode"
    - "/mall.v1.PromotionService/UpdateCampaign"
    - "/mall.v1.PromotionService/SetCampaignStatus"
    - "/mall.v1.PromotionService/ListCampaigns"
    - "/mall.v1.PromotionService/CreatePromotion"
    - "/mall.v1.PromotionService/UpdatePromotion"
    - "/mall.v1.PromotionService/SetPromotionStatus"
    - "/mall.v1.PromotionService/ListPromotions"
    - "/mall.v1.PromotionService/ListPromotionReservations"
    # 2026-11-23 (H5 stopgap): PricingService writes were missing from the DENY
    # list. The durable fix is the narrowed allow-ingress + explicit per-service
    # ALLOW matrix; these entries are the second line and must be re-reviewed
    # when the Pricing read surface is added.
    - "/mall.v1.PricingService/CreateQuote"
    - "/mall.v1.PricingService/LockCoupon"
    - "/mall.v1.PricingService/UnlockCoupon"
    - "/mall.v1.PricingService/ConsumeCoupon"
    - "/mall.v1.PricingService/TccTryConsume"
    - "/mall.v1.PricingService/TccConfirmConsume"
    - "/mall.v1.PricingService/TccCancelConsume"
    - "/mall.v1.PricingService/TccQueryConsume"
    - "/mall.v1.OrderService/CreateOrder"
    - "/mall.v1.OrderService/CreateSeckillOrder"
    - "/mall.v1.OrderService/CreateOrderInner"
    - "/mall.v1.OrderService/CancelOrder"
    - "/mall.v1.OrderService/CancelOrderInner"
    - "/mall.v1.OrderService/MarkPaid"
    - "/mall.v1.OrderService/TccTryMarkPaid"
    - "/mall.v1.OrderService/TccConfirmMarkPaid"
    - "/mall.v1.OrderService/TccCancelMarkPaid"
    - "/mall.v1.OrderService/TccQueryMarkPaid"
    - "/mall.v1.OrderService/AuthorizeShipment"
    - "/mall.v1.OrderService/BlockShipmentForRefund"
    - "/mall.v1.AfterSalesService/CreateAfterSale"
    - "/mall.v1.AfterSalesService/Approve"
    - "/mall.v1.AfterSalesService/SubmitReturnTracking"
    - "/mall.v1.AfterSalesService/ReceiveReturn"
    - "/mall.v1.AfterSalesService/Refund"
    - "/mall.v1.PaymentService/*"
    - "/mall.v1.FulfillmentService/*"
    - "/mall.v1.CartService/*"
    - "/mall.v1.IdentityService/*"
    - "/mall.v1.SeckillService/*"
    - "/mall.v1.AIService/*"
  rules:
    - name: identity
      sources: [gateway, admin]
      paths: ["/mall.v1.IdentityService/*"]
    - name: catalog
      sources: [gateway, admin, cart, pricing]
      paths: ["/mall.v1.CatalogService/*"]
    - name: catalog-ai-read
      sources: [ai]
      paths:
        - "/mall.v1.CatalogService/ListProducts"
        - "/mall.v1.CatalogService/GetProduct"
        - "/mall.v1.CatalogService/GetSku"
    - name: inventory
      sources: [gateway, admin, order, payment, aftersales, dtm, seckill]
      paths: ["/mall.v1.InventoryService/*"]
    - name: inventory-ai-read
      sources: [ai]
      paths:
        - "/mall.v1.InventoryService/ListLowStock"
        - "/mall.v1.InventoryService/GetStock"
    - name: cart
      sources: [gateway]
      paths: ["/mall.v1.CartService/*"]
    - name: pricing
      sources: [gateway, admin, order, payment, dtm]
      paths: ["/mall.v1.PricingService/*", "/mall.v1.PromotionService/*"]
    - name: pricing-ai-read
      sources: [ai]
      paths:
        - "/mall.v1.PromotionService/EvaluateDraft"
    - name: order
      sources: [gateway, admin, payment, aftersales, fulfillment, dtm, seckill]
      paths: ["/mall.v1.OrderService/*"]
    - name: order-ai-read
      sources: [ai]
      paths:
        - "/mall.v1.OrderService/ListOrders"
        - "/mall.v1.OrderService/GetOrder"
        - "/mall.v1.OrderService/GetOrderStats"
    - name: payment
      sources: [gateway, admin, aftersales, seckill, order]
      paths: ["/mall.v1.PaymentService/*"]
    - name: fulfillment
      sources: [gateway, admin, order]
      paths: ["/mall.v1.FulfillmentService/*"]
    - name: aftersales
      sources: [gateway, admin]
      paths: ["/mall.v1.AfterSalesService/*"]
    - name: aftersales-ai-read
      sources: [ai]
      paths:
        - "/mall.v1.AfterSalesService/ListAfterSales"
        - "/mall.v1.AfterSalesService/GetAfterSale"
        - "/mall.v1.AfterSalesService/GetAfterSaleStats"
    - name: seckill
      sources: [admin, gateway]
      paths: ["/mall.v1.SeckillService/*"]
    - name: ai
      sources: [gateway, admin]
      paths: ["/mall.v1.AIService/*"]
    - name: dtm
      sources: [order, payment]
      paths: ["/dtmgimp.Dtm/*"]
